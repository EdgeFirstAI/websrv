[package]
name = "edgefirst-websrv"
description = "EdgeFirst Web UI Server"
repository = "https://github.com/EdgeFirstAI/websrv"
license = "Apache-2.0"
version = "4.2.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
async-stream = "0.3.6"
camino = "1.2.6"
cdr = "0.2.4"
chrono = { version = "0.4.45", features = ["serde"] }
edgefirst-client = "2.16.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
fs2 = "0.4.3"
futures = "0.3"
hostname = "0.4.2"
listenfd = "1"
log = "0.4.34"
mcap = "0.25.0"
memmap = "0.7.0"
mime = "0.3.17"
percent-encoding = "2.3.2"
pnet = "0.35.0"
rcgen = "0.14"
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.151"
sysinfo = "0.39.6"
tempfile = "3.27"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = ["fs"] }
uuid = { version = "1.27.0", features = ["v1", "v4", "serde"] }
yawc = { version = "0.4", features = ["axum"] }
zenoh = "1.10.1"
rustls = { version = "0.23.45", features = ["aws-lc-rs"] }
rustls-pemfile = "2.2.0"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "rustls", "cookies"], default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
url = "2"
